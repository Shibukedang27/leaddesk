services:
  - type: web
    name: leaddesk-mini-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: LeadDesk Mini
      - key: APP_VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CORS_ORIGINS
        value: https://leaddesk-mini.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: TRUSTED_HOSTS
        value: leaddesk-mini-api.onrender.com,localhost,127.0.0.1
      - key: ADMIN_FULL_NAME
        value: LeadDesk Admin
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
