# Suggested GitHub labels for LeadDesk Mini.
# Apply with a label sync tool or create manually in the repository settings.

- name: "type: bug"
  color: "dc2626"
  description: "Something is broken or behaving incorrectly."
- name: "type: enhancement"
  color: "2563eb"
  description: "A product or engineering improvement."
- name: "type: documentation"
  color: "7c3aed"
  description: "README, docs, comments, or examples."
- name: "type: test"
  color: "f59e0b"
  description: "Testing, coverage, fixtures, or QA automation."
- name: "type: security"
  color: "991b1b"
  description: "Security hardening or vulnerability remediation."
- name: "type: performance"
  color: "059669"
  description: "Frontend, backend, database, or deployment performance."
- name: "area: frontend"
  color: "38bdf8"
  description: "React, UI, routing, accessibility, or frontend services."
- name: "area: backend"
  color: "10b981"
  description: "FastAPI, services, middleware, schemas, or auth."
- name: "area: database"
  color: "22c55e"
  description: "MongoDB models, indexes, queries, or connection handling."
- name: "area: deployment"
  color: "111827"
  description: "Vercel, Render, environment variables, or production config."
- name: "status: needs triage"
  color: "e5e7eb"
  description: "Needs maintainer review and prioritization."
- name: "status: blocked"
  color: "9ca3af"
  description: "Waiting on dependency, decision, or external service."
- name: "priority: high"
  color: "ef4444"
  description: "Important before release or client review."
- name: "priority: medium"
  color: "f97316"
  description: "Useful but not release-blocking."
- name: "priority: low"
  color: "84cc16"
  description: "Nice to have."
- name: "good first issue"
  color: "a7f3d0"
  description: "Approachable contribution for new contributors."
